<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340">
  <rect x="0" y="0" width="420" height="340" fill="none"/>

  <!-- livro aberto -->
  <path d="M30 60 L200 40 L200 280 L30 300 Z" fill="#fffdf7" stroke="#c9bfa0" stroke-width="2"/>
  <path d="M390 60 L220 40 L220 280 L390 300 Z" fill="#fffdf7" stroke="#c9bfa0" stroke-width="2"/>
  <path d="M200 40 L220 40 L220 280 L200 280 Z" fill="#e4dcc5"/>

  <!-- linhas do razão (página esquerda) -->
  <g stroke="#c9bfa0" stroke-width="1.4">
    <line x1="46" y1="90" x2="184" y2="80"/>
    <line x1="46" y1="112" x2="184" y2="102"/>
    <line x1="46" y1="134" x2="184" y2="124"/>
    <line x1="46" y1="156" x2="184" y2="146"/>
    <line x1="46" y1="178" x2="184" y2="168"/>
    <line x1="46" y1="200" x2="184" y2="190"/>
  </g>

  <!-- gráfico ascendente (página direita) -->
  <polyline points="236,240 264,210 292,222 320,170 348,180 374,120"
    fill="none" stroke="#2f6f5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="374" cy="120" r="6" fill="#2f6f5e"/>

  <!-- moeda -->
  <circle cx="120" cy="245" r="26" fill="#c9a227" stroke="#1b2a4a" stroke-width="2"/>
  <text x="120" y="253" font-family="Georgia, serif" font-size="24" fill="#1b2a4a" text-anchor="middle">$</text>

  <!-- lápis -->
  <g transform="translate(255 250) rotate(-35)">
    <rect x="0" y="0" width="70" height="12" rx="2" fill="#1b2a4a"/>
    <polygon points="70,0 84,6 70,12" fill="#e4b84a"/>
    <rect x="0" y="0" width="10" height="12" fill="#b5533c"/>
  </g>
</svg>
